version: 2

project_name: threads-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: threads-mcp
    main: ./cmd/threads-mcp
    binary: threads-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/granitebps/threads-mcp/internal/version.Version={{ .Version }}
      - -X github.com/granitebps/threads-mcp/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/granitebps/threads-mcp/internal/version.Date={{ .CommitDate }}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64

archives:
  - id: default
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.bundle
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

scoops:
  - name: threads-mcp
    repository:
      owner: granitebps
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/granitebps/threads-mcp
    description: Read public Threads content through MCP.
    license: Apache-2.0
    skip_upload: '{{ if envOrDefault "SCOOP_BUCKET_GITHUB_TOKEN" "" }}false{{ else }}true{{ end }}'

changelog:
  sort: asc
